[workspace]
resolver = "2"
members = [
    "crates/rc-types",
    "crates/rc-diff",
    "crates/rc-sched",
    "crates/rc-fec",
    "crates/rc-proto",
    "crates/rc-trace",
    "crates/rc-loopback",
    "crates/rc-cli",
    "crates/rc-capture",
    "crates/rc-encode",
    "crates/rc-capture-macos",
    "crates/rc-encode-vt",
    "crates/rc-input",
    "crates/rc-input-macos",
    "crates/rc-input-win",
    "crates/rc-decode",
    "crates/rc-decode-vt",
    "crates/rc-render",
    "crates/rc-render-macos",
    "crates/rc-pipeline",
    "crates/rc-net",
    "crates/rc-session",
    "crates/rc-host-macos",
    "crates/rc-audio",
    "crates/rc-tools",
    "crates/rc-ui",
]
# server/ 为独立 Rust 服务端 workspace（含 PostgreSQL / Redis / Axum / Linux splice），
# 与桌面客户端构建彻底隔离，保持客户端日常 cargo check 亚秒级速度。
exclude = ["server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"

# ─────────────────────────────────────────────────────────────
# 编译速度配置：这是 M0 的核心交付物，不要随意改动。
# 修改前请阅读 docs/07-engineering-velocity.md 与 docs/impl/60-acceptance.md
# ─────────────────────────────────────────────────────────────

[profile.dev]
opt-level = 0
debug = 1          # 只保留行号（backtrace 可用）。debug=2 会让 target/ 涨到 20-40GB
incremental = true

# 依赖只编译一次、以优化级别编译：运行快 10-50x，且之后不再重编
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 0
debug = 1

# 需要逐变量调试时才用：cargo build --profile dev-debug
[profile.dev-debug]
inherits = "dev"
debug = 2

[profile.bench]
inherits = "release"
debug = 1
lto = "thin"
codegen-units = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
