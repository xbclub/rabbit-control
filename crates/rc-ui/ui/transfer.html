<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文件传输 — RabbitControl</title>
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/pages/transfer.css" />
</head>
<body>
  <!-- Tauri 真窗口：给 body 打 .is-tauri，隐藏自绘交通灯（原生灯已由窗口提供） -->
  <script src="assets/js/tauri-detect.js"></script>
  <header class="titlebar" data-tauri-drag-region>
    <div class="traffic" aria-hidden="true" data-tauri-drag-region>
      <span class="traffic__light traffic__light--close" data-tauri-drag-region></span>
      <span class="traffic__light traffic__light--min" data-tauri-drag-region></span>
      <span class="traffic__light traffic__light--zoom" data-tauri-drag-region></span>
    </div>
    <h1 class="titlebar__title" data-tauri-drag-region>文件传输</h1>
  </header>

  <main class="tr-main">
    <section class="tr-top" aria-label="传输方向">
      <div class="tr-top__side">
        <span class="tr-top__name" id="tr-local-name" title="Y的 MacBook Pro">Y的 MacBook Pro</span>
        <span class="pill pill--local">本机</span>
      </div>
      <div class="tr-top__actions">
        <button type="button" class="btn btn--secondary" id="send-to-remote" disabled>发送 →</button>
        <button type="button" class="btn btn--secondary" id="send-to-local" disabled>← 发送</button>
      </div>
      <div class="tr-top__side tr-top__side--end">
        <span class="pill pill--remote">远端</span>
        <span class="tr-top__name" id="tr-remote-name" title="yii's MacBook Pro">yii's MacBook Pro</span>
      </div>
    </section>

    <section class="tr-panes">
      <section class="tr-pane" id="pane-local" aria-label="本机文件"></section>
      <section class="tr-pane" id="pane-remote" aria-label="远端文件"></section>
    </section>

    <section class="tr-queue" aria-label="传输列表">
      <div class="tr-queue__head">
        <h2 class="tr-queue__title">传输列表</h2>
        <span class="tr-queue__count" id="queue-count">已传输 0 个文件</span>
        <div class="tr-queue__actions">
          <button type="button" class="btn btn--secondary" id="cancel-all">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            全部取消
          </button>
          <button type="button" class="btn btn--secondary" id="clear-finished">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
            清除完结任务
          </button>
        </div>
      </div>

      <div class="tr-qtable">
        <div class="tr-qhead" role="row">
          <span role="columnheader">名称</span>
          <span role="columnheader">状态</span>
          <span role="columnheader" class="tr-num">大小</span>
          <span role="columnheader">发送路径</span>
          <span role="columnheader">接收路径</span>
          <span role="columnheader" class="tr-qhead__op">操作</span>
        </div>
        <div class="tr-qbody" id="queue-body" role="rowgroup"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/bridge.js"></script>
  <script src="assets/js/transfer.js"></script>
</body>
</html>
