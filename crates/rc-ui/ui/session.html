<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yii's MacBook Pro — RabbitControl</title>
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/pages/session.css" />
</head>
<!--
  S1 远控会话窗口（含 S2 安全状态气泡 / S3 控制中心菜单 / S4 性能 HUD）
  唯一依据：docs/reference/design/08-ui-design.md §6 S1–S4、§3.6、§4、§7
  观看模式变体：URL 加 ?mode=watch（或 ?watch=1 / #watch）
-->
<body data-page="session">
  <!-- Tauri 真窗口：给 body 打 .is-tauri，隐藏自绘交通灯（原生灯已由窗口提供） -->
  <script src="assets/js/tauri-detect.js"></script>
  <!-- Lucide 图标（lucide-static v1.77.0，ISC；内联 sprite，离线可用，不引 CDN） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="14" x="2" y="3" rx="2" /><line x1="8" x2="16" y1="21" y2="21" /><line x1="12" x2="12" y1="17" y2="21" />
      </symbol>
      <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14" /><path d="M12 5v14" />
      </symbol>
      <symbol id="i-timer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="10" x2="14" y1="2" y2="2" /><line x1="12" x2="15" y1="14" y2="11" /><circle cx="12" cy="14" r="8" />
      </symbol>
      <symbol id="i-layout-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="7" height="9" x="3" y="3" rx="1" /><rect width="7" height="5" x="14" y="3" rx="1" /><rect width="7" height="9" x="14" y="12" rx="1" /><rect width="7" height="5" x="3" y="16" rx="1" />
      </symbol>
      <symbol id="i-triangle-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" />
      </symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6" />
      </symbol>
      <symbol id="i-volume-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4.702a.7.7 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.7.7 0 0 0 11 19.298z" /><path d="m16.5 14.5 5-5" /><path d="m16.5 9.5 5 5" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </symbol>
      <symbol id="i-arrow-right-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m16 3 4 4-4 4" /><path d="M20 7H4" /><path d="m8 21-4-4 4-4" /><path d="M4 17h16" />
      </symbol>
      <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2" ry="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
      </symbol>
      <symbol id="i-app-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2" /><path d="M10 4v4" /><path d="M2 8h20" /><path d="M6 4v4" />
      </symbol>
      <symbol id="i-volume-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /><path d="M16 9a5 5 0 0 1 0 6" /><path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
      </symbol>
      <symbol id="i-joystick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 17a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2Z" /><path d="M6 15v-2" /><path d="M12 15V9" /><circle cx="12" cy="6" r="3" />
      </symbol>
      <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" />
      </symbol>
      <symbol id="i-layout-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" />
      </symbol>
      <symbol id="i-maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" />
      </symbol>
      <symbol id="i-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m16 17 5-5-5-5" /><path d="M21 12H9" /><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      </symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
      </symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5" /><line x1="12" x2="20" y1="19" y2="19" />
      </symbol>
      <symbol id="i-network" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" />
      </symbol>
    </defs>
  </svg>

  <!-- S1 会话窗口：窗口态 1280×800（08 §2），全屏优先 -->
  <div class="sn-window" id="session-window">
    <!-- 顶部会话工具栏：高 48（08 §3.3 SESSION_BAR_H） -->
    <header class="sn-bar" data-tauri-drag-region>
      <div class="sn-bar__traffic" aria-hidden="true">
        <span class="sn-bar__dot sn-bar__dot--close"></span>
        <span class="sn-bar__dot sn-bar__dot--min"></span>
        <span class="sn-bar__dot sn-bar__dot--zoom"></span>
      </div>
      <span class="sn-bar__sep" aria-hidden="true" data-tauri-drag-region></span>
      <!-- 盾 ghost → S2 安全状态气泡 -->
      <button type="button" class="sn-bar__btn" id="btn-shield"
              aria-haspopup="dialog" aria-expanded="false"
              aria-label="安全状态" title="安全状态">
        <svg class="sn-ico" width="18" height="18" aria-hidden="true"><use href="#i-shield" /></svg>
      </button>
      <span class="sn-bar__sep" aria-hidden="true" data-tauri-drag-region></span>
      <div class="sn-screen-group" data-tauri-drag-region>
        <!-- 屏幕 tab：选中白底胶囊卡 + SHADOW_CARD，文字超宽 320 尾部截断；右键切换分辨率 -->
        <div class="sn-screen-tab" id="screen-tab"
             aria-haspopup="menu" aria-expanded="false"
             title="显示屏1 (Built-in Retina Display) — 右键切换分辨率">
          <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-monitor" /></svg>
          <span class="sn-screen-tab__text" id="screen-name">显示屏1 (Built-in Retina Display)</span>
        </div>
        <!-- + ghost：禁用态（08 §6 S1） -->
        <button type="button" class="sn-bar__btn" id="btn-add-screen" disabled aria-label="添加屏幕">
          <svg class="sn-ico" width="18" height="18" aria-hidden="true"><use href="#i-plus" /></svg>
        </button>
      </div>
      <span class="sn-bar__sep" aria-hidden="true" data-tauri-drag-region></span>
      <!-- 计时器：FONT_MONO HH:MM:SS，注入时钟，从 00:00:00 起 -->
      <div class="sn-timer" role="timer" aria-live="off" data-tauri-drag-region>
        <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-timer" /></svg>
        <span id="session-timer" data-tauri-drag-region>00:00:00</span>
      </div>
      <span class="sn-bar__sep" aria-hidden="true" data-tauri-drag-region></span>
      <!-- 右侧「控制中心」ButtonGhost → S3 -->
      <button type="button" class="sn-bar__ctrl" id="btn-control-center"
              aria-haspopup="menu" aria-expanded="false">
        <svg class="sn-ico" width="18" height="18" aria-hidden="true"><use href="#i-layout-dashboard" /></svg>
        <span>控制中心</span>
      </button>
    </header>

    <!-- 内容区：STAGE_BG 铺满 + 等待/连接中提示 -->
    <main class="sn-stage" id="session-stage">
      <p class="sn-stage__hint">正在连接远端画面…</p>

      <!-- 观看模式变体：画面区左上 16px 常驻灰 Pill -->
      <span class="sn-pill sn-pill--watch sn-stage__watch" id="watch-pill" hidden>观看模式</span>

      <!-- S4 性能 HUD：右下 24；由控制中心「更多 → 显示网络状态」控制显隐 -->
      <div class="sn-hud-wrap" id="hud-wrap">
        <div class="sn-hud" id="session-hud" aria-label="性能信息">
          <!-- 首行白色，随计时同步；其余 TERMINAL_MUTED（§6 S4 七行 mock，逐字取自 §6.0） -->
          <span class="sn-hud__elapsed" id="hud-elapsed">00:00:00</span>
          <span>UDP LAN</span>
          <span>2 fps</span>
          <span>227.2 Kbps</span>
          <span>110 ms</span>
          <span>20 ms frm.</span>
          <span>0.0% loss</span>
          <span>2K</span>
        </div>
      </div>
    </main>

    <!-- Toast：距窗口底缘 24 水平居中，1.8s，单条顶替（§4 / §3.6） -->
    <div class="sn-toast" id="session-toast" role="status" aria-live="polite"></div>
  </div>

  <!-- ── S2 安全状态气泡（盾锚点，顶部箭头朝上，宽 300） ── -->
  <section class="sn-popover sn-security" id="security-popover" role="dialog"
           aria-label="安全状态" aria-modal="false" hidden>
    <span class="sn-popover__arrow" aria-hidden="true"></span>
    <div class="sn-pop__head">
      <h2 class="sn-pop__title">安全状态</h2>
      <!-- 「需关注」判定：防窥=关闭 或 自动锁屏=关 时显示 -->
      <span class="sn-pill sn-pill--warning" id="security-warning">
        <svg class="sn-ico" width="12" height="12" aria-hidden="true"><use href="#i-triangle-alert" /></svg>
        <span>需关注</span>
      </span>
    </div>
    <div class="sn-pop__divider" aria-hidden="true"></div>

    <div class="sn-sec-row">
      <svg class="sn-ico sn-sec-row__icon" width="18" height="18" aria-hidden="true"><use href="#i-monitor" /></svg>
      <span class="sn-sec-row__label">防窥模式</span>
      <div class="sn-sec-row__control">
        <label class="sn-select">
          <select id="sec-privacy" aria-label="防窥模式">
            <option value="privacy" selected>隐私屏保</option>
            <option value="black">黑屏</option>
            <option value="off">关闭</option>
          </select>
          <svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-chevron-down" /></svg>
        </label>
      </div>
    </div>
    <p class="sn-sec-desc" id="sec-privacy-desc">被控端屏幕已防护，<br />遮挡屏幕内容</p>

    <div class="sn-sec-row">
      <svg class="sn-ico sn-sec-row__icon" width="18" height="18" aria-hidden="true"><use href="#i-volume-x" /></svg>
      <span class="sn-sec-row__label">被控静音</span>
      <span class="sn-sec-row__value" id="sec-mute-value">已外放</span>
      <div class="sn-sec-row__control">
        <label class="sn-switch">
          <input type="checkbox" id="sec-mute" aria-label="被控静音" />
          <span class="sn-switch__knob"></span>
        </label>
      </div>
    </div>

    <div class="sn-sec-row">
      <svg class="sn-ico sn-sec-row__icon" width="18" height="18" aria-hidden="true"><use href="#i-lock" /></svg>
      <span class="sn-sec-row__label">自动锁屏</span>
      <span class="sn-sec-row__value" id="sec-lock-value">未开启</span>
      <div class="sn-sec-row__control">
        <label class="sn-switch">
          <input type="checkbox" id="sec-lock" aria-label="自动锁屏" />
          <span class="sn-switch__knob"></span>
        </label>
      </div>
    </div>

    <div class="sn-pop__divider" aria-hidden="true"></div>

    <div class="sn-sec-link" id="sec-link-row">
      <div class="sn-sec-link__head">
        <svg class="sn-ico sn-sec-row__icon" width="18" height="18" aria-hidden="true"><use href="#i-shield" /></svg>
        <span class="sn-sec-row__label">链路加密</span>
        <span class="sn-sec-link__badge" id="sec-transport-mode">UDP LAN</span>
      </div>
      <div class="sn-sec-link__status" id="sec-mtls-status">mTLS 1.3 双向证书已验证</div>
      <div class="sn-sec-link__fp" id="sec-peer-fp">对端证书指纹：--</div>
    </div>
  </section>

  <!-- ── S3 控制中心菜单（NativeMenu 规格；主 220） ── -->
  <section class="sn-popover sn-menu" id="control-menu" role="menu"
           aria-label="控制中心" hidden>
    <button type="button" class="sn-menu__item" role="menuitem" data-submenu="screen"
            aria-haspopup="menu" aria-expanded="false" id="menu-screen">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-monitor" /></svg>
      <span class="sn-menu__label">显示屏1 (Built-in…)</span>
      <span class="sn-menu__chevron"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-chevron-right" /></svg></span>
    </button>
    <button type="button" class="sn-menu__item" role="menuitem" data-action="next-screen"
            aria-disabled="true" title="被控端多显示器切换暂未支持" id="menu-next-screen">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-arrow-right-left" /></svg>
      <span class="sn-menu__label">切换下一个屏幕</span>
      <span class="sn-menu__shortcut">⌥⌘N</span>
    </button>
    <div class="sn-menu__sep" role="separator" aria-hidden="true"></div>

    <button type="button" class="sn-menu__item" role="menuitem" data-submenu="quality"
            aria-haspopup="menu" aria-expanded="false" id="menu-quality">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-image" /></svg>
      <span class="sn-menu__label">画质</span>
      <span class="sn-menu__chevron"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-chevron-right" /></svg></span>
    </button>
    <button type="button" class="sn-menu__item" role="menuitem" data-submenu="window"
            aria-haspopup="menu" aria-expanded="false" id="menu-window">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-app-window" /></svg>
      <span class="sn-menu__label">窗口</span>
      <span class="sn-menu__chevron"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-chevron-right" /></svg></span>
    </button>
    <button type="button" class="sn-menu__item" role="menuitem" data-submenu="sound"
            aria-haspopup="menu" aria-expanded="false" id="menu-sound">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-volume-2" /></svg>
      <span class="sn-menu__label">声音</span>
      <span class="sn-menu__chevron"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-chevron-right" /></svg></span>
    </button>
    <button type="button" class="sn-menu__item" role="menuitem" data-submenu="security"
            aria-haspopup="menu" aria-expanded="false" id="menu-security">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-shield" /></svg>
      <span class="sn-menu__label">安全</span>
      <span class="sn-menu__chevron"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-chevron-right" /></svg></span>
    </button>
    <button type="button" class="sn-menu__item" role="menuitem" data-submenu="peripherals"
            aria-haspopup="menu" aria-expanded="false" id="menu-peripherals">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-joystick" /></svg>
      <span class="sn-menu__label">外设</span>
      <span class="sn-menu__chevron"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-chevron-right" /></svg></span>
    </button>
    <button type="button" class="sn-menu__item" role="menuitem" data-submenu="tools"
            aria-haspopup="menu" aria-expanded="false" id="menu-tools">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-box" /></svg>
      <span class="sn-menu__label">工具</span>
      <span class="sn-menu__chevron"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-chevron-right" /></svg></span>
    </button>
    <button type="button" class="sn-menu__item" role="menuitemcheckbox" aria-checked="true"
            data-action="clipboard" id="menu-clipboard">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-clipboard" /></svg>
      <span class="sn-menu__label">剪贴板同步</span>
      <span class="sn-menu__shortcut" id="menu-clipboard-state">已开启</span>
    </button>
    <button type="button" class="sn-menu__item" role="menuitem" data-submenu="more"
            aria-haspopup="menu" aria-expanded="false" id="menu-more">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-layout-grid" /></svg>
      <span class="sn-menu__label">更多</span>
      <span class="sn-menu__chevron"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-chevron-right" /></svg></span>
    </button>
    <div class="sn-menu__sep" role="separator" aria-hidden="true"></div>

    <button type="button" class="sn-menu__item" role="menuitem" data-action="fullscreen">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-maximize" /></svg>
      <span class="sn-menu__label sn-fullscreen-label">进入全屏幕</span>
      <span class="sn-menu__shortcut">F</span>
    </button>
    <div class="sn-menu__sep" role="separator" aria-hidden="true"></div>

    <button type="button" class="sn-menu__item sn-menu__item--danger" role="menuitem" data-action="exit">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-log-out" /></svg>
      <span class="sn-menu__label">退出远控</span>
    </button>
  </section>

  <!-- ── S3 画质子菜单（宽 300；两单选组 + 安全中转 Switch） ── -->
  <section class="sn-popover sn-submenu" id="quality-menu" role="menu"
           aria-label="画质" hidden>
    <button type="button" class="sn-submenu__item" role="menuitemradio" data-group="bitrate" data-value="auto" aria-checked="false">
      <span class="sn-check" hidden><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>自动</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitemradio" data-group="bitrate" data-value="30m" aria-checked="false">
      <span class="sn-check" hidden><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>原画 30M</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitemradio" data-group="bitrate" data-value="14m" aria-checked="true">
      <span class="sn-check"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>超清 14M</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitemradio" data-group="bitrate" data-value="8m" aria-checked="false">
      <span class="sn-check" hidden><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>高清 8M</span>
    </button>
    <div class="sn-menu__sep" role="separator" aria-hidden="true"></div>
    <button type="button" class="sn-submenu__item" role="menuitemradio" data-group="fps" data-value="144" aria-checked="true">
      <span class="sn-check"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>144 帧</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitemradio" data-group="fps" data-value="120" aria-checked="false">
      <span class="sn-check" hidden><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>120 帧</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitemradio" data-group="fps" data-value="90" aria-checked="false">
      <span class="sn-check" hidden><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>90 帧</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitemradio" data-group="fps" data-value="60" aria-checked="false">
      <span class="sn-check" hidden><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>60 帧</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitemradio" data-group="fps" data-value="30" aria-checked="false">
      <span class="sn-check" hidden><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>30 帧</span>
    </button>
    <div class="sn-menu__sep" role="separator" aria-hidden="true"></div>
    <div class="sn-submenu__row">
      <span>使用安全中转连接</span>
      <label class="sn-switch">
        <input type="checkbox" id="opt-relay" aria-label="使用安全中转连接" />
        <span class="sn-switch__knob"></span>
      </label>
    </div>
    <p class="sn-submenu__hint">画面卡顿时，可提升流畅度，仅本次远控生效。</p>
  </section>

  <!-- ── S3 显示屏1分辨率子菜单 ── -->
  <section class="sn-popover sn-submenu sn-submenu--res" id="screen-menu" role="menu"
           aria-label="显示屏分辨率" hidden>
    <div class="sn-res-list" id="screen-main-res-list"></div>
  </section>

  <!-- ── S3 其他分辨率二级悬浮菜单 ── -->
  <section class="sn-popover sn-submenu sn-submenu--res sn-submenu--nested" id="screen-more-menu" role="menu"
           aria-label="其他分辨率" hidden>
    <div class="sn-res-list sn-res-list--more" id="screen-more-res-list"></div>
  </section>

  <!-- ── S3 窗口设置子菜单（一键消除黑边 / 全屏） ── -->
  <section class="sn-popover sn-submenu" id="window-menu" role="menu"
           aria-label="窗口设置" hidden>
    <button type="button" class="sn-submenu__item" role="menuitem" id="btn-fit-window">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-app-window" /></svg>
      <span>一键消除黑边</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitem" data-action="fullscreen" id="btn-window-fullscreen">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-maximize" /></svg>
      <span class="sn-fullscreen-label">进入全屏幕</span>
    </button>
  </section>

  <!-- ── S3 声音子菜单 ── -->
  <section class="sn-popover sn-submenu" id="sound-menu" role="menu"
           aria-label="声音" hidden>
    <button type="button" class="sn-submenu__item" role="menuitemcheckbox" id="opt-sound-play" aria-checked="true">
      <span class="sn-check"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>播放远端声音</span>
    </button>
  </section>

  <!-- ── S3 安全子菜单 ── -->
  <section class="sn-popover sn-submenu" id="security-menu" role="menu"
           aria-label="安全" hidden>
    <button type="button" class="sn-submenu__item" role="menuitemcheckbox" id="opt-watch-only" aria-checked="false">
      <span class="sn-check" hidden><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>观看模式（禁止操作）</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitem" id="btn-lock-remote-now">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-lock" /></svg>
      <span class="sn-menu__label">立即锁定被控端屏幕</span>
      <span class="sn-menu__shortcut">⌃⌘Q</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitemcheckbox" id="opt-auto-lock-exit" aria-checked="false">
      <span class="sn-check" hidden><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>退出时锁定被控端</span>
    </button>
    <div class="sn-menu__sep" role="separator" aria-hidden="true"></div>
    <div class="sn-submenu__row">
      <span>加密连接 (mTLS)</span>
      <label class="sn-switch">
        <input type="checkbox" id="opt-mtls" aria-label="加密连接 (mTLS)" checked />
        <span class="sn-switch__knob"></span>
      </label>
    </div>
  </section>

  <!-- ── S3 外设子菜单（远控 macOS 快捷键） ── -->
  <section class="sn-popover sn-submenu" id="peripherals-menu" role="menu"
           aria-label="外设" hidden>
    <button type="button" class="sn-submenu__item" role="menuitem" data-combo="spotlight">
      <span class="sn-menu__label">Spotlight</span>
      <span class="sn-menu__shortcut">⌘Space</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitem" data-combo="switch-app">
      <span class="sn-menu__label">切换应用</span>
      <span class="sn-menu__shortcut">⌘Tab</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitem" data-combo="force-quit">
      <span class="sn-menu__label">强制退出应用</span>
      <span class="sn-menu__shortcut">⌥⌘Esc</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitem" data-combo="screenshot">
      <span class="sn-menu__label">截屏</span>
      <span class="sn-menu__shortcut">⇧⌘3</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitem" data-combo="lock-screen">
      <span class="sn-menu__label">锁定屏幕</span>
      <span class="sn-menu__shortcut">⌃⌘Q</span>
    </button>
  </section>

  <!-- ── S1 显示屏选项卡右键菜单（切换分辨率 / 一键消除黑边） ── -->
  <section class="sn-popover sn-submenu sn-submenu--res" id="screen-res-menu" role="menu"
           aria-label="切换分辨率" hidden>
    <div class="sn-res-list" id="screen-res-list"></div>
    <div class="sn-menu__sep" role="separator" aria-hidden="true"></div>
    <button type="button" class="sn-submenu__item" role="menuitem" id="btn-tab-fit-window">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-app-window" /></svg>
      <span>一键消除黑边</span>
    </button>
  </section>

  <!-- ── S3 工具子菜单（快速打开 W2 文件传输 / W3 终端 / W4 端口映射） ── -->
  <section class="sn-popover sn-submenu" id="tools-menu" role="menu"
           aria-label="工具" hidden>
    <button type="button" class="sn-submenu__item" role="menuitem" data-tool="transfer">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-folder" /></svg>
      <span>文件传输</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitem" data-tool="terminal">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-terminal" /></svg>
      <span>远程终端</span>
    </button>
    <button type="button" class="sn-submenu__item" role="menuitem" data-tool="portmap">
      <svg class="sn-ico" width="16" height="16" aria-hidden="true"><use href="#i-network" /></svg>
      <span>端口映射</span>
    </button>
  </section>

  <!-- ── S3 更多子菜单（显示网络状态 HUD 开关） ── -->
  <section class="sn-popover sn-submenu" id="more-menu" role="menu"
           aria-label="更多" hidden>
    <button type="button" class="sn-submenu__item" role="menuitemcheckbox" id="opt-show-hud" aria-checked="true">
      <span class="sn-check"><svg class="sn-ico" width="14" height="14" aria-hidden="true"><use href="#i-check" /></svg></span>
      <span>显示网络状态</span>
    </button>
  </section>

  <script src="assets/js/bridge.js"></script>
  <script src="assets/js/session.js"></script>
</body>
</html>
