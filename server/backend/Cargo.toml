[package]
name = "rc-server"
version = "0.1.0"
edition = "2021"
description = "RabbitControl Rust Rendezvous, Zero-Copy TCP Relay, and Admin API Server"

# Standalone workspace marker so Cargo never searches upward into the parent client workspace.
[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "uuid", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
dashmap = "6"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = "0.6"
mimalloc = { version = "0.1", default-features = false }
async-trait = "0.1"
thiserror = "2"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10"
ring = "0.17"
rcgen = "0.13"
x509-parser = { version = "0.17", features = ["verify"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "tls12", "ring", "std"] }
rustls-pemfile = "2"
time = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
